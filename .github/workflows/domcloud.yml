name: Deploy en DOM Cloud

'on':
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: domcloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Invocar webhook de despliegue de DOM Cloud
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: https://my.domcloud.co/api/githubdeploy
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          webhook_auth: ${{ secrets.WEBHOOK_AUTH }}
          data: >-
            {"commands":[
            "git reset --hard && git pull --ff-only origin main",
            "composer install --no-dev --optimize-autoloader --no-interaction",
            "php artisan migrate --force",
            "npm ci",
            "npm run build",
            "rm -f public/hot",
            "php artisan optimize:clear",
            "php artisan optimize",
            "chmod 0750 -R storage bootstrap/cache || true"
            ]}
