name: CI y despliegue

'on':
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Estilo y tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, gd, zip, intl, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Obtener el directorio de cache de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache de Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Instalar dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependencias de Node y compilar assets
        run: |
          npm ci
          npm run build

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Revisar el estilo con Pint
        run: vendor/bin/pint --test

      - name: Ejecutar los tests
        run: php artisan test --compact

  deploy:
    name: Desplegar en DOM Cloud
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: domcloud-deploy
      cancel-in-progress: false
    steps:
      - name: Invocar webhook de despliegue de DOM Cloud
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: https://my.domcloud.co/api/githubdeploy
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          webhook_auth: ${{ secrets.WEBHOOK_AUTH }}
          data: >-
            {"commands":[
            "git reset --hard && git pull --ff-only origin main",
            "composer install --no-dev --optimize-autoloader --no-interaction",
            "php artisan migrate --force",
            "npm ci",
            "npm run build",
            "rm -f public/hot",
            "php artisan optimize:clear",
            "php artisan optimize",
            "chmod 0750 -R storage bootstrap/cache || true"
            ]}
